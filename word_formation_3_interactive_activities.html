<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Formation · Interactive Practice</title><style>
:root{--ink:#1b2744;--muted:#68758e;--blue:#3858dc;--light:#edf1ff;--green:#147b54;--red:#bb3e4e;--paper:#f4f6fb;--line:#e2e7f1;--lime:#d7f47d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 3%,#e6ecff 0,transparent 34%),var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1020px;margin:auto;padding:28px 18px 50px}.hero{background:#19264b;color:#fff;border-radius:24px;padding:29px 32px;position:relative;overflow:hidden;box-shadow:0 16px 45px #1b274411}.hero:after{content:"WORD";position:absolute;right:-12px;top:-40px;font-size:145px;letter-spacing:-.08em;font-weight:950;color:#ffffff08}.eyebrow{font-size:12px;color:var(--lime);text-transform:uppercase;letter-spacing:.15em;font-weight:900}h1{font-size:clamp(29px,5vw,45px);line-height:1.05;letter-spacing:-.045em;margin:9px 0 11px}.hero p{max-width:700px;color:#d7dfef;margin:0}.stat{display:flex;align-items:center;gap:11px;margin-top:20px;max-width:490px}.bar{flex:1;height:8px;background:#ffffff25;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--lime);transition:width .25s}.score{font-size:13px;color:#eef1f9;font-weight:800;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:19px 0}.tab{border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--muted);font:inherit;font-size:13px;font-weight:850;text-align:left;padding:12px 14px;cursor:pointer;transition:.18s}.tab span{display:block;font-size:10px;letter-spacing:.1em;color:#9ca8bb;margin-bottom:3px}.tab:hover{transform:translateY(-1px);border-color:#aab8f3}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 20px #3858dc30}.tab.active span{color:#dbe2ff}.panel{min-height:405px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 12px 38px #1b27440b}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:950;color:var(--blue)}.head h2{margin:4px 0;font-size:25px;letter-spacing:-.03em}.head p{margin:0;color:var(--muted);font-size:14px}.badge{display:inline-flex;white-space:nowrap;padding:6px 11px;border-radius:40px;background:var(--light);color:#3151c8;font-size:12px;font-weight:850}.btn{border:0;border-radius:11px;background:var(--blue);color:#fff;padding:11px 16px;font:inherit;font-weight:850;cursor:pointer;transition:.16s}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn.secondary{background:#edf0f6;color:#36425d}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.question{margin:12px 0;padding:18px;border:1px solid #edf0f6;background:#f8f9fc;border-radius:15px}.qtag{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--blue);font-weight:900}.sentence{font-size:18px;font-weight:680;margin:8px 0 14px}.options{display:grid;gap:8px}.option{border:1px solid var(--line);border-radius:10px;background:white;padding:10px 13px;font:inherit;color:var(--ink);text-align:left;cursor:pointer}.option:hover{border-color:#9aaaf2;background:#fbfbff}.option.correct{border-color:#83c9a1;background:#eaf8ef;color:#186340}.option.wrong{border-color:#e69ca5;background:#fff0f1;color:#983b47}.option:disabled{cursor:default}.feedback{min-height:22px;font-size:13px;font-weight:800;margin-top:9px}.good{color:var(--green)}.bad{color:var(--red)}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.typebox{display:flex;gap:9px}.typebox input{flex:1;min-width:0;border:1px solid #dbe1ed;border-radius:11px;padding:12px 13px;font:inherit;outline:0;color:var(--ink)}.typebox input:focus{border-color:#899bef;box-shadow:0 0 0 3px #3858dc17}.hint{margin-top:10px;font-size:13px;color:var(--muted)}.hint button{margin-left:5px;background:transparent;border:1px solid #d7def4;color:var(--blue);border-radius:9px;padding:5px 9px;font:inherit;font-weight:800;cursor:pointer}.note{background:#eef2fb;color:#485672;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:14px}.flashgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.flash{min-height:255px;width:100%;border:0;border-radius:18px;background:linear-gradient(135deg,#edf1ff,#f8f9ff);padding:25px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.flash.revealed{background:linear-gradient(135deg,#edf8dd,#fafff0)}.flash:hover{transform:translateY(-1px)}.big{font-size:clamp(26px,4.5vw,38px);font-weight:950;letter-spacing:-.04em;line-height:1.12}.sub{color:var(--muted);font-size:14px}.answer{font-size:28px;font-weight:950;letter-spacing:-.035em}.definition{font-size:15px;color:#54627d;margin-top:8px}.side{display:flex;flex-direction:column;justify-content:center;gap:12px}.side p{color:var(--muted);font-size:14px}.smallru{font-size:14px;color:#5d6b85;margin-top:10px}.foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:16px;color:var(--muted);font-size:12px}.foot button{border:0;background:transparent;color:var(--blue);font:inherit;font-weight:850;cursor:pointer}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@media(max-width:680px){.wrap{padding:16px 12px 35px}.hero{padding:23px 20px}.hero:after{font-size:100px;top:-18px}.tabs{gap:6px}.tab{padding:10px;font-size:12px}.panel{padding:18px 15px}.head{display:block}.badge{margin-top:11px}.flashgrid{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side p{grid-column:1/-1;margin-bottom:0}.typebox{flex-direction:column}.foot{align-items:flex-start}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">English practice · word formation</div><h1>Build the right word form.</h1><p>Choose the right form, produce it from the root, and review each word family. All seven target answers come from your worksheet.</p><div class="stat"><div class="bar"><span id="progress"></span></div><div class="score" id="score">0 of 14 correct</div></div></header><nav class="tabs" aria-label="Choose activity"><button class="tab active" data-tab="1"><span>ACTIVITY 01</span>Multiple choice</button><button class="tab" data-tab="2"><span>ACTIVITY 02</span>Type the word form</button><button class="tab" data-tab="3"><span>ACTIVITY 03</span>Word-family flashcards</button></nav><section class="panel" id="panel" aria-live="polite"></section><footer class="foot"><span>Tip: notice whether the sentence needs a noun, adjective, or another form.</span><button id="reset">↻ Reset all progress</button></footer></main><script>
const words=[
 {root:'POSSESS',form:'possessions',pos:'plural noun',meaning:'things that someone owns',ru:'имущество, вещи',sentence:'Nomadic tribes often have few possessions.',gap:'Nomadic tribes often have few _____.',hint:'The sentence needs a plural noun: the things people own.'},
 {root:'IMMIGRATE',form:'immigration',pos:'noun',meaning:'the act or process of moving to live in another country',ru:'иммиграция',sentence:'Illegal immigration is a major social problem.',gap:'Illegal _____ is a major social problem.',hint:'After “illegal”, the sentence needs a noun for the process.'},
 {root:'RESPONSIBLE',form:'responsibility',pos:'noun',meaning:'a duty or something that someone is accountable for',ru:'ответственность',sentence:'A well-ordered community is everyone’s responsibility.',gap:'A well-ordered community is everyone’s _____.',hint:'After “everyone’s”, use a noun. Notice the spelling change: -ible → -ibility.'},
 {root:'EMOTION',form:'emotional',pos:'adjective',meaning:'showing or involving strong feelings',ru:'эмоциональный',sentence:'Daniel gave the tribesmen an emotional goodbye.',gap:'Daniel gave the tribesmen an _____ goodbye.',hint:'It describes the noun “goodbye”, so use an adjective.'},
 {root:'VANDALISE',form:'vandalism',pos:'noun',meaning:'the deliberate damage of property',ru:'вандализм',sentence:'We don’t go into the town centre because of all the vandalism.',gap:'We don’t go into the town centre because of all the _____.',hint:'After “all the”, use a noun for damage to property.'},
 {root:'INSPECT',form:'inspection',pos:'noun',meaning:'an official examination or check',ru:'осмотр, проверка',sentence:'Poorer passengers had a medical inspection when they arrived at Ellis Island.',gap:'Poorer passengers had a medical _____ when they arrived at Ellis Island.',hint:'After “medical”, use a noun meaning an examination or check.'},
 {root:'HOSPITABLE',form:'hospitality',pos:'noun',meaning:'a friendly and generous welcome to guests',ru:'гостеприимство',sentence:'They are famous for their hospitality.',gap:'They are famous for their _____.',hint:'After “their”, use a noun. The adjective “hospitable” changes to “hospitality”.'}
];
const mcQs=[
 {i:0,opts:['possessions','possessive','possessing'],why:'“Few” is followed by a plural noun: possessions.'},
 {i:1,opts:['immigrate','immigration','immigrant'],why:'“Illegal” modifies the noun immigration here.'},
 {i:2,opts:['responsibly','responsibility','responsible'],why:'“Everyone’s” needs the noun responsibility.'},
 {i:3,opts:['emotionally','emotional','emotion'],why:'The word describes “goodbye”, so we need the adjective emotional.'},
 {i:4,opts:['vandalise','vandalism','vandalised'],why:'“All the” is followed by the noun vandalism.'},
 {i:5,opts:['inspector','inspection','inspect'],why:'“Medical inspection” is the noun phrase for a medical check.'},
 {i:6,opts:['hospitable','hospital','hospitality'],why:'“Their” needs the noun hospitality.'}
];let tab=1,mi=0,mcScore=0,ti=0,typeScore=0,fi=0,flipped=false,total=0;
function award(){total=Math.min(14,total+1);document.getElementById('score').textContent=total+' of 14 correct';document.getElementById('progress').style.width=(total/14*100)+'%'}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',+b.dataset.tab===tab));if(tab===1)drawMC();if(tab===2)drawType();if(tab===3)drawFlash()}
function drawMC(){if(mi>=mcQs.length){document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 01 · Multiple choice</div><h2>Round complete</h2><p>You got ${mcScore} of 7 correct.</p></div><span class="badge">${mcScore} / 7</span></div><div class="question">${mcScore===7?'Perfect score! You identified every word form.':mcScore>=5?'Great job. Review the words you missed and play again.':'Keep practising—look for clues such as articles, possessives, and describing nouns.'}</div><button class="btn" id="again">↻ Play again</button>`;document.getElementById('again').onclick=()=>{mi=0;mcScore=0;drawMC()};return}const q=mcQs[mi],w=words[q.i];document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 01 · Multiple choice</div><h2>Choose the correct word form</h2><p>Look at the grammar around the gap for a clue.</p></div><span class="badge">QUESTION ${mi+1} / 7</span></div><div class="question"><div class="qtag">Base word: ${w.root}</div><div class="sentence">${w.gap}</div><div class="options">${q.opts.map((o,j)=>`<button class="option" data-opt="${j}">${o}</button>`).join('')}</div><div class="feedback" id="mcFeedback"></div></div><button class="btn" id="next" disabled>${mi===6?'See result':'Next question'} →</button>`;let done=false;document.querySelectorAll('[data-opt]').forEach((b,j)=>b.onclick=()=>{if(done)return;done=true;const ok=q.opts[j]===w.form;b.classList.add(ok?'correct':'wrong');document.querySelectorAll('[data-opt]').forEach((x,k)=>{x.disabled=true;if(q.opts[k]===w.form)x.classList.add('correct')});let f=document.getElementById('mcFeedback');f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'Correct! ':'Not quite. ')+q.why;if(ok){mcScore++;award()}document.getElementById('next').disabled=false});document.getElementById('next').onclick=()=>{mi++;drawMC()}}
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z ]/g,'').trim().replace(/\s+/g,' ')}function drawType(){if(ti>=words.length){document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 02 · Produce the form</div><h2>Word formation complete</h2><p>You typed ${typeScore} of 7 answers correctly.</p></div><span class="badge">${typeScore} / 7</span></div><div class="question">${typeScore>=6?'Excellent recall. The word forms are sticking.':'Review the flashcards, then try again without looking.'}</div><button class="btn" id="retryType">↻ Practise again</button>`;document.getElementById('retryType').onclick=()=>{ti=0;typeScore=0;drawType()};return}const w=words[ti];document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 02 · Produce the form</div><h2>Type the missing word</h2><p>Use the capitalized root word to build the correct form.</p></div><span class="badge">WORD ${ti+1} / 7</span></div><div class="question"><div class="qtag">Root word: ${w.root}</div><div class="sentence">${w.gap}</div><form class="typebox" id="typeForm"><label class="sr" for="typed">Type the word</label><input id="typed" autocomplete="off" placeholder="Type the correct form…"><button class="btn" id="check">Check</button></form><div class="hint" id="hintLine">Want a hint? <button type="button" id="hintBtn">Show hint</button></div><div class="feedback" id="typeFeedback"></div><div id="reveal"></div></div><button class="btn" id="nextType" disabled>${ti===6?'See result':'Next word'} →</button>`;let done=false;const input=document.getElementById('typed');document.getElementById('typeForm').onsubmit=e=>{e.preventDefault();if(done)return;done=true;const ok=norm(input.value)===norm(w.form);const f=document.getElementById('typeFeedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'Exactly right!':'The correct form is “'+w.form+'”.';if(ok){typeScore++;award()}document.getElementById('reveal').innerHTML=`<div class="note"><b>${w.form}</b> · ${w.pos}<br>${w.meaning}<br><i>${w.sentence}</i></div>`;input.disabled=true;document.getElementById('check').disabled=true;document.getElementById('nextType').disabled=false};document.getElementById('hintBtn').onclick=()=>{document.getElementById('hintLine').textContent='Hint: '+w.hint};document.getElementById('nextType').onclick=()=>{ti++;drawType()};input.focus()}
function drawFlash(){const w=words[fi];document.getElementById('panel').innerHTML=`<div class="head"><div><div class="kicker">Activity 03 · Word-family flashcards</div><h2>Build the word family</h2><p>Use the root to recall the target form, then flip to check.</p></div><span class="badge">CARD ${fi+1} / 7</span></div><div class="flashgrid"><button class="flash ${flipped?'revealed':''}" id="flash"><span class="big">${flipped?`<span class="answer">${w.form}</span>`:w.root}</span><span>${flipped?`<span class="definition"><b>${w.pos}</b> · ${w.meaning}<br><br>${w.sentence}</span><span class="smallru">Russian: ${w.ru}</span>`:'<span class="sub">Think: what form does the sentence need? Tap to reveal ↻</span>'}</span></button><div class="side"><p>Say the answer aloud before flipping. Pay attention to spelling changes, not only suffixes.</p><button class="btn" id="nextFlash">${fi===6?'Start again':'Next card'} →</button><button class="btn secondary" id="shuffle">↻ Random card</button></div></div>`;document.getElementById('flash').onclick=()=>{flipped=!flipped;drawFlash()};document.getElementById('nextFlash').onclick=()=>{fi=(fi+1)%words.length;flipped=false;drawFlash()};document.getElementById('shuffle').onclick=()=>{fi=Math.floor(Math.random()*words.length);flipped=false;drawFlash()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});document.getElementById('reset').onclick=()=>{mi=0;mcScore=0;ti=0;typeScore=0;fi=0;flipped=false;total=0;document.getElementById('score').textContent='0 of 14 correct';document.getElementById('progress').style.width='0%';tab=1;render()};render();
</script></body></html>
